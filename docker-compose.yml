services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rogueskills
      POSTGRES_USER: rogueskills
      POSTGRES_PASSWORD: rogueskills-dev
    ports:
      - "5432:5432"
    volumes:
      - rogueskills-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rogueskills"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - rogueskills-redis:/data

volumes:
  rogueskills-postgres:
  rogueskills-redis:
