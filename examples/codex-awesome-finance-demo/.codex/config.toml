[mcp_servers.rogueskills-demo]
command = "../../.venv/bin/python"
args = ["-m", "rogueskills.mcp.case_bridge"]
default_tools_approval_mode = "approve"
enabled_tools = [
  "list_initial_skills",
  "get_skill",
  "get_skill_version",
  "list_evolution_runs",
  "get_evolution_run",
  "get_agent_preset",
  "get_demo_context",
  "list_case_packs",
  "get_case_pack",
  "case_preflight",
  "run_case",
  "get_case_run",
  "get_case_report",
  "get_case_evaluation",
]

[mcp_servers.rogueskills-demo.env]
PYTHONPATH = "../../backend"
ROGUESKILLS_API_BASE_URL = "http://127.0.0.1:5173"
ROGUESKILLS_ALLOWED_CASE_PACKS = "finance-stock-analysis"
ROGUESKILLS_DEFAULT_FINANCE_SKILL_ID = "alphaear-signal-tracker-90641e"
ROGUESKILLS_DEFAULT_CASE_SKILL_VERSIONS = '{"finance-stock-analysis":"alphaear-signal-tracker-90641e@2"}'

[mcp_servers.node_repl]
enabled = false
