[project]
name = "rogueskills"
version = "0.2.0"
description = "A Python backend and TypeScript-ready frontend for evolvable agent skills."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonpatch>=1.33,<2",
  "jsonschema>=4.23,<5",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
agent = [
  "langgraph>=0.2,<2",
  "playwright>=1.47,<2",
]
worker = [
  "celery[redis]>=5.4,<6",
]
observability = [
  "langfuse>=2.50,<4",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "structlog>=24.4,<26",
]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
rogueskills = "rogueskills.main:run"
rogueskills-finance-mcp = "rogueskills.mcp.finance_bridge:main"
rogueskills-case-mcp = "rogueskills.mcp.case_bridge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/rogueskills"]

[tool.hatch.build]
artifacts = [
  "backend/rogueskills/domain/data/*.json",
  "backend/rogueskills/infrastructure/migrations/script.py.mako",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests/python"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "tests/python"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["rogueskills"]
mypy_path = "backend"
